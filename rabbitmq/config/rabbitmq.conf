# RabbitMQ 4.x configuration for the lab broker.
# Only settings that are actually used by lab-amqp are listed here.

# AMQP listener (published to the host on 0.0.0.0:5672).
listeners.tcp.default = 5672

# Management plugin. The container listens on all interfaces, but
# docker-compose.yml publishes this port only on 127.0.0.1 of the host.
# Access it through an SSH tunnel (see README.md).
management.tcp.port = 15672
management.tcp.ip = 0.0.0.0

# The built-in "guest" user is always loopback-only. We do not use it;
# lab_user is created by the image entrypoint from .env.
loopback_users.guest = true
