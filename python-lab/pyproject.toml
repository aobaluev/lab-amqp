[project]
name = "lab-messaging"
version = "0.1.0"
description = "Python messaging lab: MQTT, AMQP, JSON contracts"
requires-python = ">=3.11"
dependencies = [
    "pika>=1.0.0,<2.0.0",
    "paho-mqtt>=2.0.0,<3.0.0",
    "pydantic>=2.0.0,<3.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0,<9.0.0",
    "pytest-mock>=3.0.0,<4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0,<9.0.0",
    "pytest-mock>=3.0.0,<4.0.0",
]