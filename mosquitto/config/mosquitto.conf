# Eclipse Mosquitto 2.x configuration for the lab broker.

# MQTT listener on all container interfaces.
# docker-compose.yml publishes it on the host as 0.0.0.0:1883.
listener 1883 0.0.0.0

# Authentication is mandatory: anonymous clients are rejected.
allow_anonymous false
password_file /mosquitto/config/passwd

# Persist queued messages, subscriptions and retained messages.
persistence true
persistence_location /mosquitto/data/
# Flush the persistence database to disk every 10 seconds. The Mosquitto
# default is 1800 seconds, which is inconvenient in a lab: a hard kill
# could lose recent state.
autosave_interval 10

# Log to stdout so that `docker compose logs` / scripts/logs.sh work.
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true
